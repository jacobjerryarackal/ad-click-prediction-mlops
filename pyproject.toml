[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-click-prediction"
version = "0.1.2"
description = "Ad Click Prediction MLOps Pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "zenml[server]",
    "mlflow",
    "evidently",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "pyarrow",
    "fastparquet",
    "pymysql",
    "sqlmodel",
    "fastapi<=0.112.2",
    "starlette<=0.39.2",
    "uvicorn",
    "streamlit>=1.39.0",
    "requests"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.setuptools]
packages = ["core", "steps", "pipelines"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.poetry]
package-mode = false
